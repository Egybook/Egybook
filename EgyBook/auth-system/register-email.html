<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041329"><title>إنشاء حساب جديد بالبريد الإلكتروني | EgyBook</title><link rel="stylesheet" href="assets/auth.css"></head><body data-page="register-email"><main class="auth-card"><header class="brand"><div class="logo">Egy<span>Book</span></div></header><div class="tagline">تواصل • شارك • اكتشف أكثر</div><h1>إنشاء حساب جديد بالبريد الإلكتروني</h1><p class="sub">انضم إلى مجتمع EgyBook وابدأ رحلتك معنا</p><div class="switch"><button type="button" class="" onclick="location.href='register-phone.html'">رقم الهاتف</button><button type="button" class="active" onclick="location.href='register-email.html'">البريد الإلكتروني</button></div><form id="signupForm"><label class="field">ادخل اسمك الكامل<input id="fullName" autocomplete="name" maxlength="60" placeholder="الاسم الكامل" required></label><label class="field">ادخل اسم المستخدم<input id="username" autocomplete="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9._]+" placeholder="username" required></label><label class="field">ادخل بريدك الإلكتروني<input class="ltr" id="email" type="email" autocomplete="email" placeholder="name@example.com" required></label><label class="field">ادخل كلمة المرور<div class="password-wrap"><input id="password" type="password" minlength="8" autocomplete="new-password" required><button class="eye" type="button" data-target="password" aria-label="إظهار كلمة المرور">◉</button></div></label><label class="field">أعد إدخال كلمة المرور<div class="password-wrap"><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button class="eye" type="button" data-target="confirmPassword" aria-label="إظهار كلمة المرور">◉</button></div></label><label class="field"><span><input id="terms" type="checkbox" required> أوافق على شروط الاستخدام وسياسة الخصوصية</span></label><button class="btn" id="signupBtn">إنشاء الحساب</button></form><div class="foot">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></div><p id="hint" class="hint" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/auth.js"></script></body></html>
