<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041329"><title>مرحبًا بعودتك | EgyBook</title><link rel="stylesheet" href="assets/auth.css"></head><body data-page="login"><main class="auth-card"><header class="brand"><div class="logo">Egy<span>Book</span></div></header><div class="tagline">تواصل • شارك • اكتشف أكثر</div><h1>مرحبًا بعودتك</h1><p class="sub">سجّل دخولك لمتابعة أصدقائك ومشاركة لحظاتك</p><div class="switch"><button type="button" class="active" data-method="email">البريد الإلكتروني</button><button type="button" data-method="phone">رقم الهاتف</button></div><form id="loginForm"><div id="emailLogin"><label class="field">ادخل بريدك الإلكتروني<input id="loginEmail" type="email" autocomplete="username" placeholder="name@example.com" required></label><label class="field">ادخل كلمة المرور<div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required><button class="eye" type="button" data-target="loginPassword" aria-label="إظهار كلمة المرور">◉</button></div></label></div><div id="phoneLogin" class="hidden"><label class="field">ادخل رقم هاتفك بالمفتاح الدولي<input id="loginPhone" class="ltr" type="tel" placeholder="+2010XXXXXXXX"></label><p class="hint">سيتم إرسال رمز تحقق عبر SMS حسب إعدادات مزود الخدمة.</p></div><div class="links"><label><input type="checkbox" checked> تذكرني</label><a href="forgot-password.html" id="forgotLink">نسيت كلمة المرور؟</a></div><button class="btn" id="loginBtn">تسجيل الدخول</button></form><div class="foot">ليس لديك حساب؟ <a href="register-phone.html">إنشاء حساب جديد</a></div><p id="hint" class="hint" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/auth.js"></script></body></html>
