<script>
(function(){
  // Preserve the exact deep link (including query/hash) when GitHub Pages falls
  // back to this file. The app restores it after its auth/session bootstrap.
  var target = location.pathname + location.search + location.hash;
  var base = '/Egybook/';
  if (target.toLowerCase().indexOf(base.toLowerCase()) !== 0) {
    target = base;
  }
  location.replace(base + '?route=' + encodeURIComponent(target));
})();
</script>
